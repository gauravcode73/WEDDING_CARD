.border.l{left:0;transform:scaleX(-1)}.border.r{right:0}
.car{position:absolute;left:34.5%;width:31%;height:40.2%;top:-20.1%;z-index:5;filter:drop-shadow(1.2cqw 1.8cqw 1.4cqw rgba(60,30,10,.38))}
.car img{width:100%;height:100%;display:block}
.layer{position:absolute;inset:0;z-index:3;text-align:center;color:var(--maroon)}
.fit{display:inline-block;white-space:nowrap}
/* title, spread over the whole road */
#title .tcol{position:absolute;left:25%;right:25%;top:36.5%;display:flex;flex-direction:column;align-items:center;gap:1.5cqw;font-size:16cqw}
#title .tw{writing-mode:vertical-rl;white-space:nowrap;line-height:1.05;font-family:'Great Vibes',cursive;font-size:1em;color:var(--maroon);text-shadow:0 .3cqw 0 rgba(255,238,205,.35)}
#title .tw2{color:#fffaf0;text-shadow:0 0 .8cqw rgba(90,40,10,.45),.2cqw .3cqw .4cqw rgba(90,40,10,.35)}
.content{opacity:0;transition:opacity .4s ease}
.content.on{opacity:1}
.row{position:absolute;left:25%;right:25%;opacity:0;transform:translateY(1.2cqw);transition:opacity .7s ease,transform .7s ease}
.row.on{opacity:1;transform:none}
.nm{font-family:'Great Vibes',cursive;font-size:10.5cqw;line-height:1.15;color:var(--maroon);white-space:nowrap;-webkit-text-stroke:.28cqw var(--maroon);text-shadow:var(--halo)}
.weds,.small{font-family:'Great Vibes',cursive;font-size:7cqw;color:var(--cocoa);line-height:1.1;white-space:nowrap;-webkit-text-stroke:.16cqw var(--cocoa);text-shadow:var(--halo)}
.mantra{font-family:'Tiro Devanagari Hindi','Noto Serif Devanagari',serif;font-size:5.2cqw;color:var(--maroon);line-height:1.3;white-space:nowrap;-webkit-text-stroke:.1cqw var(--maroon);text-shadow:var(--halo)}
.rm{top:3cqw}.r1{top:12cqw}.r2{top:25.5cqw}.r3{top:34cqw}.d0{top:53cqw}.d1{top:61.5cqw}.d3{top:80.5cqw}.d4{top:85cqw}
.scratchwrap{position:relative;display:inline-block;padding:.4cqw 2.2cqw .6cqw}
.scratchwrap canvas{position:absolute;inset:0;width:100%;height:100%;border-radius:2.5cqw;cursor:crosshair;touch-action:none;transition:opacity .8s ease}
.scratchwrap canvas.done{opacity:0;pointer-events:none}
.scratchwrap .nm{opacity:0;transition:opacity .8s ease .2s}
.scratchwrap .nm.show{opacity:1}
.hint{font-size:3.8cqw;font-weight:700;font-style:italic;color:var(--cocoa);text-shadow:var(--halo);margin-top:.4cqw;transition:opacity .6s}
.hint.gone{opacity:0}
.big{font-family:'Playfair Display',Georgia,serif;font-weight:800;color:var(--maroon);line-height:1;white-space:nowrap;text-shadow:var(--halo)}
.dates{font-size:6.9cqw}
.dates sup{font-size:.4em;vertical-align:.95em;margin-left:.04em}
.amp{font-family:'Great Vibes',cursive;font-size:.9em;color:var(--cocoa);margin:0 .22em;font-weight:400}
.mon{font-size:6.9cqw;font-weight:800;letter-spacing:.03em;margin-top:1cqw}
.venue{font-family:'Playfair Display',Georgia,serif;font-weight:800;font-size:6.9cqw;letter-spacing:.06em;color:var(--maroon);white-space:nowrap;text-shadow:var(--halo)}
.venue-l{font-family:'Great Vibes',cursive;font-size:7cqw;color:var(--cocoa);line-height:1;-webkit-text-stroke:.16cqw var(--cocoa);text-shadow:var(--halo)}
.orn{display:block;margin:0 auto;width:26cqw;height:3cqw;opacity:.8}
/* butterfly */
.bf{position:absolute;z-index:6;left:0;top:0;width:9cqw;height:10.5cqw;pointer-events:none;opacity:0;will-change:transform;
  filter:drop-shadow(1.4cqw 2.1cqw .8cqw rgba(60,30,10,.28))}
.bf svg{width:100%;height:100%;display:block;overflow:visible}
.mute{position:fixed;left:max(12px,env(safe-area-inset-left));bottom:max(12px,env(safe-area-inset-bottom));z-index:20;border:0;border-radius:99px;padding:.5rem .8rem;background:var(--btn-bg);color:var(--btn-fg);font:600 .95rem 'Cormorant Garamond',Georgia,serif;cursor:pointer;opacity:.9}
.replay{position:fixed;right:max(12px,env(safe-area-inset-right));bottom:max(12px,env(safe-area-inset-bottom));z-index:20;border:0;border-radius:99px;padding:.55rem 1rem;background:var(--btn-bg);color:var(--btn-fg);font:600 .95rem 'Cormorant Garamond',Georgia,serif;cursor:pointer;opacity:.9}
.replay:focus-visible,.scratchwrap canvas:focus-visible{outline:2px solid var(--maroon);outline-offset:3px}
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="floor"></div>
  <div class="border l"></div>
  <div class="border r"></div>

  <!-- title: spread over the whole road, wiped away by the car -->
  <div class="layer" id="title" aria-label="Love has a date">
    <div class="tcol" id="tcol"><span class="tw tw1">Love</span><span class="tw tw2">Has a</span><span class="tw tw3">Date</span></div>
  </div>

  <div class="layer content" id="content">
    <div class="row rm" id="rm"><div class="mantra">॥ श्री गणेशाय नमः ॥</div></div>
    <div class="row r1" id="r1"><span class="nm">Priyanka</span></div>
    <div class="row r2" id="r2"><span class="weds">weds</span></div>
    <div class="row r3" id="r3">
      <div class="scratchwrap" id="sw"><span class="nm" id="pname">Prathamesh</span>
        <canvas id="cv" tabindex="0" aria-label="Scratch to reveal the name"></canvas></div>
      <div class="hint" id="hint">scratch to reveal</div>
    </div>
    <div class="row d0" id="d0"><span class="small">on the</span></div>
    <div class="row d1" id="d1">
      <div class="big dates"><span>3<sup>rd</sup></span><span class="amp">&amp;</span><span>4<sup>th</sup></span></div>
      <div class="big mon" id="mon">March 2027</div>
    </div>
    <div class="row d3" id="d2"><svg class="orn" viewBox="0 0 120 12"><path d="M0 6h46M74 6h46" stroke="#7a1126" stroke-width="1" fill="none"/><path d="M60 1l5 5-5 5-5-5z" fill="#7a1126"/></svg></div>

<script>
(function(){
  // ---- Edit if needed ----
  var MONTH = "March 2027";
  // ------------------------
  var $ = function(id){return document.getElementById(id)};
  var stage=$('stage');
  $('mon').textContent = MONTH;
  var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

  // ---- Fit all text inside the road ----
  function fit(){
    var u=stage.clientWidth/100;
    document.querySelectorAll('.fit').forEach(function(el){
      var base=parseFloat(el.dataset.size||26);
      el.style.fontSize=base+'cqw';
      var max=parseFloat(el.dataset.fit)*u, w=el.getBoundingClientRect().width;
      if(w>max) el.style.fontSize=(base*max/w)+'cqw';
    });
    // title: words run down the road (rotated), sized to fill the lower part
    var col=$('tcol');col.style.fontSize='16cqw';
    var hh=col.getBoundingClientRect().height;
    if(hh>0){col.style.fontSize=Math.min(26,16*(98*u)/hh)+'cqw'}
  }

  // ---- Timeline ----
  var song=$('song'),car=$('car'),title=$('title'),content=$('content'),pname=$('pname');
  var rows=['rm','r1','r2','r3','d0','d1','d2','d3'].map($);
  var DRIVE=4800,START=300,CAR_H=40.2,START_TOP=-20.1,END_TOP=58,H=177.78;
  var timers=[],raf=0;
  function later(fn,ms){timers.push(setTimeout(fn,ms))}
  // quick pick-up, steady drive, smooth stop (no stop-and-go)
  var ease=function(p){var a=.16,d=.4,area=1-(a+d)/2;
    if(p<=0)return 0;if(p>=1)return 1;
    if(p<a)return p*p/(2*a)/area;
    if(p<=1-d)return (a/2+(p-a))/area;
    return (a/2+(1-a-d)+d/2-(1-p)*(1-p)/(2*d))/area};

  function reset(){
    timers.forEach(clearTimeout);timers=[];cancelAnimationFrame(raf);try{song.pause()}catch(e){}
    car.style.top=START_TOP+'%';
    title.style.clipPath='inset(0 0 0 0)';
    content.classList.remove('on');rows.forEach(function(r){r.classList.remove('on')});pname.classList.remove('show');
    BFS.forEach(function(b){b.el.style.opacity=0});
    initScratch(true);
  }

  // butterfly state
  // ---- Butterflies: 2 monarchs + 2 cream ones, drifting like in the reference ----
  var BFS=[];
  var BF_SPEC=[
    {type:'o',at:500, x:-9, y:32, h:.35,          v:14, f:3.6},   // monarch drifts in from the left
    {type:'c',at:3200,x:109,y:62, h:Math.PI-.35,   v:12, f:4.3},   // cream one from the right
    {type:'o',at:6000,x:72, y:-10,h:1.95,          v:13, f:3.2},   // second monarch from the top
    {type:'c',at:8200,x:-9, y:122,h:-.3,           v:11, f:4.6}    // second cream one from the left
  ];
  function bfSvg(type){
    var ink=type==='o'?'#1d130e':'#4a3a28';
    var wing=type==='o'?'#wingO':'#wingC';
    return '<svg viewBox="0 0 60 70" aria-hidden="true"><g class="wr"><use href="'+wing+'"/></g><g class="wl"><use href="'+wing+'"/></g>'+
      '<path d="M30 22 C28 15 24 10 21 8" stroke="'+ink+'" stroke-width="1" fill="none" stroke-linecap="round"/><path d="M30 22 C32 15 36 10 39 8" stroke="'+ink+'" stroke-width="1" fill="none" stroke-linecap="round"/>'+
      '<circle cx="21" cy="8" r="1.2" fill="'+ink+'"/><circle cx="39" cy="8" r="1.2" fill="'+ink+'"/>'+
      '<ellipse cx="30" cy="37" rx="'+(type==='o'?2.2:1.8)+'" ry="15" fill="'+ink+'"/><circle cx="30" cy="22" r="'+(type==='o'?3:2.5)+'" fill="'+ink+'"/>'+
      (type==='o'?'<circle cx="29" cy="21" r=".7" fill="#fff"/><circle cx="31" cy="21" r=".7" fill="#fff"/><g fill="#fff7e2"><circle cx="29.2" cy="32" r=".6"/><circle cx="30.8" cy="35" r=".6"/><circle cx="29.2" cy="38" r=".6"/><circle cx="30.8" cy="41" r=".6"/></g>':'')+
      '</svg>';
  }
  function bfReset(){
    BFS.forEach(function(b){b.el.remove()});BFS=[];
    BF_SPEC.forEach(function(sp){
      var el=document.createElement('div');el.className='bf';el.innerHTML=bfSvg(sp.type);
      stage.appendChild(el);
      BFS.push({el:el,svg:el.firstChild,wR:el.querySelector('.wr'),wL:el.querySelector('.wl'),sp:sp,
        x:sp.x,y:sp.y,h:sp.h,v:sp.v,ph:Math.random()*6.28,w:1,s:1,last:0,mode:'flap',mt:1+Math.random(),bc:0,bias:0,biasT:0,seed:Math.random()*10});
    });
  }
  function stepBF(b,now,t){
    var tt=t-START-b.sp.at;
    if(reduce||tt<0){b.el.style.opacity=0;return}
    var dt=b.last?Math.min((now-b.last)/1000,.05):.016;b.last=now;
    // gentle drift: heading changes slowly, never in a hurry
    b.biasT-=dt;if(b.biasT<=0){b.bias=(Math.random()-.5)*1.1;b.biasT=1.4+Math.random()*2}
    b.bc+=(b.bias-b.bc)*Math.min(1,dt*1.2);
    var m=14,ed=Math.min(b.x,100-b.x,b.y,H-b.y);
    if(ed<m){   // near the edge of the frame: curve softly back inwards
      var wall=Math.min(1,(m-ed)/m),wantC=Math.atan2(H/2-b.y,50-b.x);
      var d=((wantC-b.h+Math.PI*3)%(2*Math.PI))-Math.PI;b.h+=d*wall*1.5*dt;
    }
    b.h+=b.bc*dt;
    // slow, lazy wing beats with gliding in between
    b.mt-=dt;
    if(b.mt<=0){
      if(b.mode==='flap'){b.mode='glide';b.mt=.5+Math.random()*.9}
      else{b.mode='flap';b.mt=1.2+Math.random()*2}
    }
    b.w+=((b.mode==='flap'?1:0)-b.w)*Math.min(1,dt*5);
    b.ph+=dt*2*Math.PI*b.sp.f*(b.w>.05?1:.25);
    var flapS=.24+.76*Math.pow(.5+.5*Math.cos(b.ph),.9);
    b.s=.84*(1-b.w)+flapS*b.w;
    var vt=b.sp.v*(1+.18*Math.sin(tt/2300+b.seed))*(b.mode==='flap'?(.9+.2*Math.sin(b.ph)):.82);
    b.v+=(vt-b.v)*Math.min(1,dt*2.5);
    b.x+=Math.cos(b.h)*b.v*dt;b.y+=Math.sin(b.h)*b.v*dt;
    b.x=Math.max(-16,Math.min(116,b.x));b.y=Math.max(-20,Math.min(H+10,b.y));
    b.wR.setAttribute('transform','translate(30 0) scale('+b.s.toFixed(3)+' 1) translate(-30 0)');
    b.wL.setAttribute('transform','translate(30 0) scale('+(-b.s).toFixed(3)+' 1) translate(-30 0)');
    var bob=.5*Math.sin(b.ph+1.2)*b.w,roll=4*Math.sin(tt/700+b.seed);
    b.el.style.transform='translate('+(b.x-4.5).toFixed(2)+'cqw,'+(b.y-5.25+bob).toFixed(2)+'cqw)';
    b.svg.style.transform='rotate('+(b.h*180/Math.PI+90+roll).toFixed(1)+'deg)';
    b.el.style.opacity=1;
  }
  function frame(now){
    var t=now-T0;
    var p=Math.min(Math.max((t-START)/DRIVE,0),1),e=ease(p);
    var top=START_TOP+(END_TOP-START_TOP)*e;
    car.style.top=top.toFixed(3)+'%';
    title.style.clipPath='inset('+(top+CAR_H).toFixed(3)+'% 0 0 0)';
    BFS.forEach(function(b){stepBF(b,now,t)});
    if(!reduce || p<1){ raf=requestAnimationFrame(frame); }
  }
  var T0=0;
  // music: only the instrumental tune (the part before the lyrics begin), played once with the animation
  // Browsers only allow sound after a first touch, so: try to start right away,
  // and if the browser says no, start the music on the very first touch anywhere on the page.
  var pending=false,lastUnlock=0;
  function setMusicLabel(){$('mute').textContent=(pending||song.muted)?'🔇 Music':'🔊 Music'}
  function startSong(){
    try{song.currentTime=0;var pr=song.play();if(pr&&pr.catch)pr.catch(function(){pending=true;setMusicLabel()})}
    catch(e){pending=true;setMusicLabel()}
  }
  function unlock(){
    if(!pending)return;pending=false;lastUnlock=Date.now();
    try{song.currentTime=0;var q=song.play();if(q&&q.catch)q.catch(function(){pending=true;setMusicLabel()})}catch(e){}
    setMusicLabel();
  }
  ['pointerdown','touchend','click','keydown'].forEach(function(ev){document.addEventListener(ev,unlock,true)});
  function play(){
    reset();bfReset();fit();initScratch(false);
    T0=performance.now();raf=requestAnimationFrame(frame);startSong();
    // after the car has gone: Priyanka weds, then the scratch card
    var tp=START+DRIVE*.92;   // text starts as the car settles
    later(function(){content.classList.add('on')},tp);
    rows.slice(0,4).forEach(function(r,i){later(function(){r.classList.add('on')},tp+i*300)});
  }

  // ---- Scratch-off on "Prathamesh" ----
  var cv=$('cv'),ctx=cv.getContext('2d'),sw=$('sw'),hint=$('hint');
  var scratching=false,revealed=false,strokes=0,ready=false,last=null;
  function initScratch(hide){
    revealed=false;strokes=0;hint.classList.remove('gone');cv.classList.remove('done');ready=false;
    if(hide){ctx.clearRect(0,0,cv.width,cv.height);return}
    var r=sw.getBoundingClientRect(),dpr=Math.min(window.devicePixelRatio||1,2);
    cv.width=Math.max(2,Math.round(r.width*dpr));cv.height=Math.max(2,Math.round(r.height*dpr));
    ctx.globalCompositeOperation='source-over';
    var g=ctx.createLinearGradient(0,0,cv.width,cv.height);
    g.addColorStop(0,'#cfa84f');g.addColorStop(.35,'#f6e3a6');g.addColorStop(.6,'#c79a3c');g.addColorStop(1,'#efd88f');
    ctx.fillStyle=g;ctx.fillRect(0,0,cv.width,cv.height);
    for(var i=0;i<260;i++){
      ctx.fillStyle='rgba(255,255,255,'+(Math.random()*.35)+')';
      ctx.fillRect(Math.random()*cv.width,Math.random()*cv.height,dpr*(1+Math.random()*2),dpr*(1+Math.random()*2));
    }
    ctx.fillStyle='rgba(107,15,31,.55)';
    ctx.font='italic 600 '+Math.round(cv.height*.3)+'px "Cormorant Garamond",Georgia,serif';
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText('scratch me',cv.width/2,cv.height/2);
    ready=true;
  }
  function pos(e){var r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)*cv.width/r.width,y:(e.clientY-r.top)*cv.height/r.height}}
  function dot(p){ctx.globalCompositeOperation='destination-out';ctx.beginPath();ctx.arc(p.x,p.y,cv.height*.17,0,6.283);ctx.fill()}
  function line(a,b){ctx.globalCompositeOperation='destination-out';ctx.lineCap='round';ctx.lineWidth=cv.height*.34;ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke()}
  function check(){
    try{
      var d=ctx.getImageData(0,0,cv.width,cv.height).data,c=0,n=0;
      for(var i=3;i<d.length;i+=64){n++;if(d[i]<20)c++}
      if(c/n>.5)finish();
    }catch(e){finish()}
  }
  function finish(){
    if(revealed)return;revealed=true;cv.classList.add('done');hint.classList.add('gone');pname.classList.add('show');
    // date and venue are added only after the name is revealed
    rows.slice(4).forEach(function(r,i){later(function(){r.classList.add('on')},200+i*300)});
  }
  cv.addEventListener('pointerdown',function(e){if(!ready||revealed)return;scratching=true;cv.setPointerCapture(e.pointerId);last=pos(e);dot(last);hint.classList.add('gone');e.preventDefault()});
  cv.addEventListener('pointermove',function(e){if(!scratching)return;var p=pos(e);line(last,p);last=p;if(++strokes%6===0)check()});
  function up(){if(scratching){scratching=false;check()}}
  cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
  cv.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){finish();e.preventDefault()}});
  window.addEventListener('resize',function(){fit();if(ready&&!revealed&&strokes===0)initScratch(false)});

  $('replay').addEventListener('click',play);
  $('mute').addEventListener('click',function(){
    if(Date.now()-lastUnlock<400)return;          // this very tap just started the music
    song.muted=!song.muted;setMusicLabel();
  });
  var fl=[document.fonts.load('40px "Great Vibes"'),document.fonts.load('800 40px "Playfair Display"'),document.fonts.load('700 20px "Playfair Display"'),document.fonts.load('20px "Tiro Devanagari Hindi"'),document.fonts.load('600 20px "Cormorant Garamond"'),document.fonts.load('italic 600 20px "Cormorant Garamond"')];
  Promise.all(fl).catch(function(){}).then(function(){play()});
})();
</script>
